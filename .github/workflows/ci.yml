# Проверки шаблона MCP-сервера (формат, vet, тесты с -race, сборка) и образ примера. Образ публикуется
# в ghcr.io (Packages этого репозитория):
#   ветка main   → :main и :sha-<коммит>
#   тег vX.Y.Z   → :X.Y.Z и :latest
# Задания идут на своём раннере организации (метка local). Проверки — в контейнере, на хост ничего не ставится.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: local
    container: golang:1.25.3-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      # шаги в контейнере идут от root: возвращаем файлы пользователю раннера, иначе он не очистит каталог
      - name: права на каталог
        if: always()
        run: chown -R "$(stat -c %u:%g ..)" .

  image:
    needs: [go]
    runs-on: local
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/keremet-development/keremet-mcp-template
    steps:
      - uses: actions/checkout@v4
      - name: сборка
        run: |
          docker build -t "$IMAGE:run-$GITHUB_RUN_ID" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: публикация
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/publish.sh "$IMAGE:run-$GITHUB_RUN_ID" "$IMAGE"
      - name: убрать локальный образ
        if: always()
        run: docker image rm "$IMAGE:run-$GITHUB_RUN_ID" || true
