# CI/CD шаблона MCP-сервера для команд: только проверка.
# Ветки и теги: dev, main — тесты; тег vX.Y.Z — GitLab Release. Раннер с тегом docker.

variables:
  GO_IMAGE: "registry.infocom.kg/dockerhub/library/golang:1.25.3-bookworm"

default:
  tags: [docker]

stages: [test, release]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

test:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  image: $GO_IMAGE
  script:
    - go vet ./...
    - go test -race ./...

# Свой центр сертификации git.infocom.lan: переменная GITLAB_CERTIFICATE (PEM текстом или File) — в системные
# ca-certificates образа, им доверяют git, curl и go. Нет переменной — ничего не делаем.
.ca:
  before_script:
    - |
      if [ -n "$GITLAB_CERTIFICATE" ]; then
        mkdir -p /usr/local/share/ca-certificates
        if [ -f "$GITLAB_CERTIFICATE" ]; then cp "$GITLAB_CERTIFICATE" /usr/local/share/ca-certificates/gitlab.crt
        else printf '%s\n' "$GITLAB_CERTIFICATE" > /usr/local/share/ca-certificates/gitlab.crt; fi
        command -v update-ca-certificates >/dev/null || apk add --no-cache ca-certificates >/dev/null
        update-ca-certificates >/dev/null 2>&1
      fi

# GitLab Release по тегу: коммиты от прошлого тега vX.Y.Z (ключ задания CI — прав хватает). $IMAGE_LINE — строка
# про образ (пусто — у проекта нет образа). Повторный запуск обновляет описание.
.release-notes:
  script:
    - apk add --no-cache git curl jq >/dev/null
    - !reference [.ca, before_script]
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$CI_COMMIT_TAG^" 2>/dev/null || true)
    - CHANGES=$(git log --no-merges --format='- %s (%h)' "${PREV:+$PREV..}$CI_COMMIT_TAG")
    - BODY=$(printf '%s\n\n## Изменения%s\n%s\n' "$IMAGE_LINE" "${PREV:+ с $PREV}" "$CHANGES")
    - jq -n --arg tag "$CI_COMMIT_TAG" --arg name "$CI_PROJECT_NAME $CI_COMMIT_TAG" --arg d "$BODY" '{tag_name:$tag, name:$name, description:$d}' > release.json
    - URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
    - CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "JOB-TOKEN:$CI_JOB_TOKEN" -H "Content-Type:application/json" --data @release.json "$URL")
    - |
      if [ "$CODE" = 409 ]; then
        CODE=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "JOB-TOKEN: $CI_JOB_TOKEN" -H "Content-Type:application/json" --data @release.json "$URL/$CI_COMMIT_TAG")
      fi
      case "$CODE" in 2*) echo "релиз $CI_COMMIT_TAG: $CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG" ;; *) echo "релиз не создан: HTTP $CODE"; exit 1 ;; esac

# Релиз по тегу vX.Y.Z: только GitLab Release (образа у проекта нет).
release:
  stage: release
  image: registry.infocom.kg/dockerhub/library/alpine:3.22
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    GIT_DEPTH: "0"
  script:
    - IMAGE_LINE=""
    - !reference [.release-notes, script]
